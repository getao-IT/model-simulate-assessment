server:
  port: 8888
  servlet:
    context-path: /model-assessment

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/simulate_assessment_temp?useSSL=false&useUnicode=true&characterEncoding=utf8
    #url: jdbc:postgresql://192.168.2.169:32189/simulate_assessment?useSSL=false&useUnicode=true&characterEncoding=utf8
    #url: jdbc:postgresql://192.168.2.169:32189/simulate_assessment_test?useSSL=false&useUnicode=true&characterEncoding=utf8
    #url: jdbc:postgresql://192.168.3.13:32189/test?useSSL=false&useUnicode=true&characterEncoding=utf8
    username: iecas
    password: 123456
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  aop:
    proxy-target-class: true

  cache:
    type: redis
  redis:
    host: 192.168.2.156
    port: 32190
    database: 2
    jedis:
      pool:
        max-active: 200
        max-wait: -1
        max-idle: 10
        min-idle: 10
    timeout: 2000

  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false
        hbm2ddl:
          auto: update

  # 集成54日志
  application:
    name: model-assessment-service

# mybatis plus 设置
mybatis-plus:
  type-aliases-package: cn.iecas.simulate.assessment.entity.domain
  global-config:
    # 关闭 mybatis-plus的 banner
    banner: false
  type-handlers-package: cn.iecas.simulate.assessment.common.typehandler
  mapper-locations: classpath:mapper/*.xml
  configuration:
    jdbc-type-for-null: null
    # 配置控制台打印日志Debug
    logging:
      level:
        cn.iecas.simulate.assessment: debug
    debug: true
    # 配置sql控制台输出
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

value:
  model-api:
    #get-simulate-data: http://ip:port/XSYPPG/model/selectModel/mfhfx
    #get-simulate-data: http://192.168.2.169:8088/file-process/receive/getSimulateData
    #get-simulate-data: http://localhost:8003/file-process/receive/getSimulateData
    #get-simulate-data: http://localhost:8088/geoai/v1/receive/getSimulateData
    #getAllIndexIndicatorTask: http://localhost:8088/geoai/v1/receive/getAllIndexIndicatorTask
    #queryZbCompare: http://localhost:8088/geoai/v1/receive/queryZbCompare
    get-simulate-data: http://localhost:8888/model-assessment/testController/getSimulateData
    getAllIndexIndicatorTask: http://localhost:8888/model-assessment/testController/getAllIndexIndicatorTask
    queryZbCompare: http://localhost:8888/model-assessment/testController/queryZbCompare
    getSimulateRealData: http://localhost:8888/model-assessment/testController/getSimulateRealData
    pullSimulateData: http://localhost:8888/model-assessment/testController/pullSimulateData
    getSamplesetInfo: http://192.168.3.13:28000/geoapi/V1/sampleset-platform/sampleset
    getRealData: http://localhost:8888/model-assessment/testController/getRealData
    getSimulateDt: http://localhost:8888/model-assessment/testController/getSimulateDt
    getProcessData: http://localhost:8888/model-assessment/testController/getProcessData

  user-api:
    user-info: http://192.168.11.81:31151/api/v1/users/token_check
    user-query-name: http://192.168.11.81:31151/api/v1/users/simplified_info/get?user_ids={user_ids}

assessment:
  use-default-data: true
  sys-sign: IECASMSA
  detection:
    defaultOutput: D:\file\黄寺\开发\modelRunData\output
    defaultSamplePath: /var/nfs/general/data
  init:
    # 开启指标初始化
    enableforce: false
    # 开启系统、场景、模型初始化
    integrated: false
    systemSign: ZGDK28SYWMXXT
    modelsigns:
      - mfhfx
      - zmdb
    tables:
      - tb_index_info
      - tb_model_info
      - tb_system_info
  fhgxfx:
    modelSign: mfhfx
    territoryTypeStand: 2
    territoryNumStand: 500
    scandalTypeStand: 3
    scandalNumStand: 500
  zmdb:
    modelSign: zmdb
    modeltype: 中美力量实力对比评估模型
    indexBuildType: 3
    indexBuildNum: 9
    overallCompareType: 3
    overallCompareNum: 9
    economyType: 3
    economyNum: 9
    militaryType: 3
    militaryNum: 9
    technologyType: 3
    technologyNum: 9

file:
  modify:
    type: xml, txt, json, yml, yaml, properties
  default-save-path: /home/temporary

external-data-access:
  use-test: false
  pageSize: 10
  frequency: 30
  groupCount: 5
  way: KEEP
  base: 2
  # 注意！此部分的端口号，需要与部署时的端口号一致
  default-request-url: http://127.0.0.1:8888/model-assessment/simulateDataController
  thread-setting:
    max: 5

swagger:
  licenseUrl: http://localhost:8888//model-assessment/swagger-ui.html

# 集成54日志
log-record:
  enabled: true
  # 日志要传输的服务地址
  url: https://192.168.210.155:16301/eslog/index/sdk
  # 日志要存的索引模式
  index: es-log
  # 是否启用专用线程池
  threak-pool:
    enabled: true
  service-conf:
    data-id: simulate-assessment
    service-name: 模型能力平行仿真评估工具
    ip: localhost
    index-name: simulate-assessment-index